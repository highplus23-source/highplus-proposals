<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg');

  function b64(x){
    var s = atob(x), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    var pass = pw.value;
    if (!pass) return;
    msg.textContent = '';
    go.disabled = true;
    go.textContent = '확인 중';

    crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2', salt:b64(P.s), iterations:P.it, hash:'SHA-256'},
          km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      })
      .then(function(key){
        return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.d));
      })
      .then(function(buf){
        var html = new TextDecoder().decode(buf);
        try { sessionStorage.setItem('hp_k', pass); } catch(err){}
        document.open(); document.write(html); document.close();
      })
      .catch(function(){
        go.disabled = false;
        go.textContent = '열람하기';
        msg.textContent = '비밀번호가 올바르지 않습니다.';
        pw.value = '';
        pw.focus();
      });
  });

  // 새로고침 시 다시 입력하지 않도록 세션 내에서만 자동 복호화
  try {
    var saved = sessionStorage.getItem('hp_k');
    if (saved) { pw.value = saved; f.dispatchEvent(new Event('submit')); }
  } catch(err){}
})();
</script>
